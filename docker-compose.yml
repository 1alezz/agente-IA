version: '3.9'
services:
  api:
    build: .
    command: uvicorn trading_agent.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
  dashboard:
    build: ./dashboard
    command: npm run dev -- --host --port 4173
    ports:
      - "4173:4173"
    volumes:
      - ./dashboard:/app
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: agente
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
